    <script>
      // Pre-paint theme & strict-CSP runtime hygiene (Plan 3.8: zero 'unsafe-inline').
      (function () {
        try {
          var meta = document.querySelector('meta[property="csp-nonce"]');
          var nonce = meta ? meta.getAttribute('content') : '';
          if (nonce && typeof Document !== 'undefined') {
            var origCreate = Document.prototype.createElement;
            Document.prototype.createElement = function (tagName, options) {
              var el = origCreate.call(this, tagName, options);
              if (tagName && String(tagName).toLowerCase() === 'style' && !el.nonce) {
                el.nonce = nonce;
              }
              return el;
            };
          }
          if (typeof Element !== 'undefined') {
            var origSetAttr = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function (name, value) {
              var lower = name ? String(name).toLowerCase() : '';
              if (lower.indexOf('on') === 0 && value === 'return;') {
                if (lower in this) {
                  this[lower] = function () {};
                }
                return;
              }
              return origSetAttr.call(this, name, value);
            };
          }
          if (typeof CSSStyleDeclaration !== 'undefined') {
            var desc = Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, 'cssText');
            if (desc && desc.set && desc.configurable) {
              Object.defineProperty(CSSStyleDeclaration.prototype, 'cssText', {
                configurable: true,
                enumerable: desc.enumerable,
                get: desc.get,
                set: function (val) {
                  var str = String(val || '');
                  var parts = str.split(';');
                  for (var i = 0; i < parts.length; i++) {
                    var idx = parts[i].indexOf(':');
                    if (idx > 0) {
                      var prop = parts[i].slice(0, idx).trim();
                      var raw = parts[i].slice(idx + 1).trim();
                      var imp = /!important$/i.test(raw);
                      this.setProperty(prop, imp ? raw.replace(/\s*!important$/i, '') : raw, imp ? 'important' : '');
                    }
                  }
                }
              });
            }
          }
          var saved = localStorage.getItem('catalystlab_theme_preference');
          var theme = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'light';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.setProperty('color-scheme', dark ? 'dark' : 'light');
          if (dark) root.classList.add('dark');
        } catch (e) { /* noop */ }
      })();
    </script>
