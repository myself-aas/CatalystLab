name: CI

# Answer #8 (2026-10-19) + Release Readiness Blockers #1–#8 (2026-10-21):
# Every pull request and push to `main` executes the complete verification suite:
#   1. Gates (Node 24): env parity (41 keys), ESLint, TypeScript, Vitest + coverage
#      ratchet, zero-vulnerability npm audit (prod + dev), clean-instance backup &
#      restore drill, 2Checkout sandbox webhook retry/ordering e2e, full-history
#      secret scan, production peak load test (D16 SLOs), live server header/CSP
#      verification, and remote media R4 contract check.
#   2. Security, SAST, Alerts & Container Audit: full-history Gitleaks scan,
#      Semgrep SAST ruleset, Prometheus alert rule validation (`promtool`), and
#      multi-stage non-root Docker build + live container health/CSP smoke verification.
#   3. Browser E2E & Zero-CSP-Violation Smoke: headless Chromium Playwright suite
#      verifying zero `securitypolicyviolation` DOM events and zero console CSP errors.
#   4. Lighthouse CI (answer #12): Accessibility >= 0.90, SEO >= 0.85, Best Practices
#      budgets across the running production server with zero CSP regressions.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (Node 24)
    runs-on: ubuntu-24.04
    env:
      APP_ORIGIN: https://www.catalystlab.tech
      VITE_APP_ORIGIN: https://www.catalystlab.tech
      FIREBASE_SERVICE_ACCOUNT_PATH: .github/fixtures/ci-service-account.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # check:env && lint && typecheck && test && build (+ prerender) && check:bundle
      - name: Full gate set
        run: npm run ci

      - name: Coverage ratchet (vitest.config.ts thresholds)
        run: npm run test:coverage

      - name: Dependency vulnerability gate (0 vulnerabilities across prod + dev, Blocker #1)
        run: npm audit --audit-level=low

      - name: Clean-instance backup & restore verification drill (Plan 4.6 / Blocker #6 & #8)
        run: npm run drill:restore

      - name: Payment sandbox, 503 outage retry, idempotency & Q32 gate e2e (Blocker #8)
        run: npm run test:payments-sandbox

      - name: Working-tree & full git history secret audit (Plan 3.13 / Blocker #7)
        run: npm run sec:secrets

      - name: Production server peak load test & D16 p95 SLO verification (Plan 10.3 / Blocker #6)
        run: npm run test:load

      - name: Production smoke & security header contract check (Plan 3.5, 3.8, 5.7, Q32)
        run: |
          NODE_ENV=production PORT=3000 PAYMENTS_ENABLED=false node dist/server.cjs > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -TERM "$SERVER_PID" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::dist/server.cjs did not answer /api/health within 30s"
            tail -40 /tmp/server.log
            exit 1
          fi
          set -e
          node scripts/verify-deployment.mjs http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pricing.html)" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/reports)" = "501"
          curl -fsS http://127.0.0.1:3000/pricing | grep -q 'rel="canonical" href="https://www.catalystlab.tech/pricing"'

      - name: Media integrity
        run: npm run media:check

      - name: Upload build output
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  security-and-container:
    name: Security, SAST, Alert Rules & Container Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gitleaks full git history scan (Plan 3.13 / Blocker #7)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose

      - name: Semgrep SAST scan (Plan 3.14 / Blocker #7)
        run: |
          pipx install semgrep==1.102.0
          semgrep scan --config .semgrep.yml --error server src scripts worker

      - name: Validate Prometheus alert rules syntax (Plan 8.5 / Blocker #6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq prometheus
          promtool check rules docs/ops/alerts.yml

      - name: Build production Docker image & verify non-root runtime + live contracts (Plan 5.1)
        run: |
          docker build -t catalystlab:ci .
          RUNTIME_USER="$(docker inspect --format '{{.Config.User}}' catalystlab:ci)"
          test "${RUNTIME_USER}" = "node"
          docker run -d --rm --name catalystlab-ci-container -p 3100:3000 \
            -e APP_ORIGIN=http://127.0.0.1:3100 \
            -e PAYMENTS_ENABLED=false \
            catalystlab:ci
          trap 'docker stop catalystlab-ci-container >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/system/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            docker logs catalystlab-ci-container
            exit 1
          fi
          node scripts/verify-deployment.mjs http://127.0.0.1:3100

  e2e-chromium:
    name: Headless Chromium E2E & Zero-CSP-Violation Smoke
    runs-on: ubuntu-24.04
    env:
      APP_ORIGIN: http://127.0.0.1:3098
      VITE_APP_ORIGIN: http://127.0.0.1:3098
      FIREBASE_SERVICE_ACCOUNT_PATH: .github/fixtures/ci-service-account.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies & Chromium browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build production bundle & execute Playwright E2E suite (Plan 3.8 & 9.2)
        run: |
          npm run build
          npm run test:e2e

  lighthouse:
    name: Lighthouse CI (answer #12)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      APP_ORIGIN: https://www.catalystlab.tech
      VITE_APP_ORIGIN: https://www.catalystlab.tech
      FIREBASE_SERVICE_ACCOUNT_PATH: .github/fixtures/ci-service-account.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify the production host boots
        run: |
          NODE_ENV=production PORT=3000 node dist/server.cjs > /tmp/lhci-server.log 2>&1 &
          SERVER_PID=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::dist/server.cjs did not answer /api/health within 30s"
            tail -40 /tmp/lhci-server.log
            exit 1
          fi
          echo "production host boots and answers /api/health"

      - name: Lighthouse CI
        id: lhci
        continue-on-error: true
        run: npx lhci autorun
        env:
          NODE_ENV: production
          PORT: '3000'
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Summarise Lighthouse scores
        if: always()
        run: node scripts/report-lhci.mjs | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/lhci-report.md

      - name: Comment scores on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Lighthouse CI — commit $GITHUB_SHA"
            echo
            cat /tmp/lhci-report.md
          } > /tmp/lhci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lhci-comment.md

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail when a route missed its budget
        if: always()
        run: node scripts/report-lhci.mjs --strict > /dev/null

      - name: Fail when Lighthouse collection failed
        if: steps.lhci.outcome == 'failure'
        run: |
          echo "::error::Lighthouse CI did not pass. Scores are in the job summary and the PR comment; raw reports are in the lighthouse-reports artifact."
          exit 1
