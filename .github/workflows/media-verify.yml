name: Media Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: media-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-media:
    name: Verify Remote Media Endpoints (R4 Contract)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci > /tmp/npm-ci.log 2>&1 || {
            echo "::error title=Dependency Lockfile ERESOLVE::$(grep -E 'npm error|ERESOLVE|Conflicting peer' /tmp/npm-ci.log | head -n 8 | tr '\n' ' ')"
            cat /tmp/npm-ci.log
            exit 1
          }
          cat /tmp/npm-ci.log

      - name: Verify Live Unsplash & Pexels Endpoints
        run: |
          npm run media:check > /tmp/media-check.log 2>&1 || {
            echo "::error title=Remote Media Endpoint Failure::$(tail -n 15 /tmp/media-check.log | tr '\n' ' ')"
            cat /tmp/media-check.log
            exit 1
          }
          cat /tmp/media-check.log
