<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalyst Score Report</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Catalyst Score Report</h1>
      <p id="reportUrl"></p>
    </header>

    <main id="reportContent">
      <div class="score-section">
        <div class="score-circle">
          <span id="overallScore" class="big-score">--</span>
          <span id="grade" class="grade">--</span>
        </div>
      </div>

      <div class="ad-container">
        <!-- AdSense unit goes here after approval -->
      </div>

      <h2>Category Scores</h2>
      <canvas id="radarChart" width="400" height="400"></canvas>

      <h2>Details</h2>
      <div id="categories"></div>

      <button id="saveReportBtn">Save as Public Lab Report</button>
      <div id="publicLink" style="display:none;">
        Public URL: <a href="#" id="publicUrlLink"></a>
      </div>

      <p><a href="index.html">← Run another analysis</a></p>
    </main>

    <footer>
      <p>© 2026 Catalyst Lab</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
