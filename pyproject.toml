# Python tooling config for scripts/replace_images.py (inert to the JS toolchain).
# Install dev tools:  python3 -m pip install -r scripts/requirements-dev.txt

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["scripts"]
files = ["scripts"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
