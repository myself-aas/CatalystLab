<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Health Analyzer | CatalystLab</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/firebase-bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="light-mode">
  <div class="container container-wide">
    <header class="page-header">
      <h1>Website Health Analyzer</h1>
      <p>Deep diagnostic scan of DOM complexity, resource hints, and rendering bottlenecks.</p>
    </header>

    <main class="reports-main">
      <section class="analyze-card" style="max-width: 800px; margin: 0 auto 3rem auto;">
        <form id="healthForm">
          <div class="form-group-row">
            <div class="url-input-container">
              <span class="url-input-icon"><span class="material-symbols-outlined">stethoscope</span></span>
              <input type="text" id="healthUrl" placeholder="https://example.com" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary" id="analyzeBtn">Run Health Audit</button>
          </div>
        </form>
      </section>

      <section id="resultsSection" style="display: none; max-width: 800px; margin: 0 auto;">
        <div class="glass-panel" style="padding: 2rem;">
          <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <span><span class="material-symbols-outlined">stethoscope</span></span> Diagnostic Output
          </h2>
          <div style="background: #0f172a; border-radius: 8px; padding: 1.5rem; overflow-x: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
            <pre id="terminalOutput" style="color: #cbd5e1; font-family: monospace; font-size: 0.9rem; line-height: 1.6; margin: 0; white-space: pre-wrap;"></pre>
          </div>
        </div>
      </section>
    </main>
  </div>

<script>
window.CLEscape=window.CLEscape||function(s){return String(s==null?'':s).replace(/[&<>"'`]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]);});};
window.CLColorize=window.CLColorize||function(r){return window.CLEscape(r);};
</script>
<script src="/xss-guard.js"></script>
  <script>
    document.getElementById('healthForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('healthUrl').value;
      const btn = document.getElementById('analyzeBtn');
      const resultsSection = document.getElementById('resultsSection');
      const terminal = document.getElementById('terminalOutput');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Scanning...';
      resultsSection.style.display = 'block';
      terminal.innerHTML = `[sys] Initializing Health Analyzer...\n[sys] Target locked: ${window.CLEscape(url)}\n[sys] Fetching DOM and tracing headers...`;

      try {
        const response = await fetch('/api/run-engine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, engine: 'health' })
        });
        
        const data = await response.json();
        if (data.success) {
          terminal.innerHTML = window.CLColorize(data.output);

          // Auto-save to Firestore if authenticated
          if (window.CatalystFirebase && window.currentUser) {
            try {
              const reportId = await window.CatalystFirebase.saveReport(url, 'health', data.output, {
                title: 'HEALTH Audit: ' + url
              });
              const shareLink = window.location.origin + '/report.html?id=' + reportId;
              
              const prevBanner = document.getElementById('saveBannerResult');
              if (prevBanner) prevBanner.remove();
              
              const banner = document.createElement('div');
              banner.id = 'saveBannerResult';
              banner.style.margin = '1rem 0';
              banner.style.padding = '1rem 1.25rem';
              banner.style.background = 'rgba(16, 185, 129, 0.12)';
              banner.style.border = '1px solid #10b981';
              banner.style.borderRadius = '8px';
              banner.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                  <div>
                    <strong style="color: #4ade80;"><span class="material-symbols-outlined">check</span> Audit Saved to Dashboard!</strong>
                    <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.2rem;">
                      Permalink: <a href="${window.CLEscape(shareLink)}" target="_blank" style="color: #38bdf8; text-decoration: underline;">${window.CLEscape(shareLink)}</a>
                    </div>
                  </div>
                  <div style="display: flex; gap: 0.5rem;">
                    <button onclick="navigator.clipboard.writeText('${window.CLEscape(shareLink)}'); alert('Copied link!');" class="btn btn-outline" style="padding: 0.35rem 0.7rem; font-size: 0.8rem;"><span class="material-symbols-outlined">link</span> Copy Link</button>
                    <a href="/dashboard.html" class="btn btn-primary" style="padding: 0.35rem 0.7rem; font-size: 0.8rem;"><span class="material-symbols-outlined">analytics</span> Dashboard</a>
                  </div>
                </div>
              `;
              resultsSection.insertBefore(banner, resultsSection.firstChild);
            } catch (saveErr) {
              console.error("Failed to auto-save to Firestore:", saveErr);
            }
          }
    
        } else {
          terminal.innerHTML = `<span style="color:#f87171;">Error executing engine: ${window.CLEscape(data.error)}</span>`;
        }
      } catch (err) {
        terminal.innerHTML = `<span style="color:#f87171;">Network Error: Could not connect to API.</span>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Run Health Audit';
      }
    });
  </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userNameDisplay = document.getElementById('userNameDisplay');
        
        if (window.CatalystFirebase) {
          window.CatalystFirebase.onAuthStateChanged(window.CatalystFirebase.auth, (user) => {
            if (user) {
              loginBtn.style.display = 'none';
              logoutBtn.style.display = 'block';
              userNameDisplay.style.display = 'block';
              userNameDisplay.textContent = user.displayName || user.email;
              window.currentUser = user;
            } else {
              loginBtn.style.display = 'block';
              logoutBtn.style.display = 'none';
              userNameDisplay.style.display = 'none';
              window.currentUser = null;
            }
          });
          
          if(loginBtn) {
            loginBtn.addEventListener('click', async () => {
              try {
                await window.CatalystFirebase.loginWithGoogle();
              } catch (e) {
                console.error("Login Error", e);
                alert("Login failed. Check console.");
              }
            });
          }
          
          if(logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
              try {
                await window.CatalystFirebase.logout();
              } catch (e) {
                console.error("Logout Error", e);
              }
            });
          }
        }
      });
    </script>
    
</body>
</html>
