<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 24" role="img" aria-label="CatalystLab">
  <defs>
    <style>
      .catalyst-wordmark {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.3px;
        fill: #1C1E21;
      }
      @media (prefers-color-scheme: dark) {
        .catalyst-wordmark {
          fill: #F7FDFF;
        }
      }
    </style>
    <linearGradient id="catalyst-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>
  <!-- Molecule mark: network bonds + nodes, scaled from the 100x100 mark to 24x24 -->
  <g transform="scale(0.24)">
    <g stroke="url(#catalyst-grad)" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="50" y1="50" x2="50" y2="20" />
      <line x1="50" y1="50" x2="78" y2="66" />
      <line x1="50" y1="50" x2="22" y2="66" />
      <line x1="50" y1="50" x2="50" y2="82" />
    </g>
    <g fill="url(#catalyst-grad)">
      <circle cx="50" cy="50" r="10" />
      <circle cx="50" cy="20" r="7" />
      <circle cx="78" cy="66" r="7" />
      <circle cx="22" cy="66" r="7" />
      <circle cx="50" cy="82" r="7" />
    </g>
  </g>
  <text x="32" y="17" class="catalyst-wordmark">CatalystLab</text>
</svg>
